name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.asset-path.outputs.prefix }}
      base-url: ${{ steps.asset-path.outputs.base-url }}
      artifact-name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Install immutable dependencies
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
      - name: Check canonical Calcit source
        run: |
          set -euo pipefail
          test "$(calcit --version)" = "0.27.0"
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --check-only
          calcit analyze check-public --ns app.main --ns app.comp.container --ns app.config --ns app.schema --ns app.updater --summary-only
          calcit analyze deprecated --summary-only
      - name: Select frontend CDN path
        id: asset-path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          asset_prefix="${GITHUB_REPOSITORY}/"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/"
          fi
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=https://cos-sh.tiye.me/${asset_prefix}" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        env:
          VITE_BASE_URL: ${{ steps.asset-path.outputs.base-url }}
        run: yarn build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error

  upload:
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: upload-${{ github.repository }}-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.test.outputs.artifact-name }}
          path: dist
      - name: Reject superseded production deployment
        id: deploy-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping superseded production deployment."
              exit 0
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Upload and publicly verify frontend
        if: steps.deploy-head.outputs.current == 'true'
        uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ needs.test.outputs.prefix }}
          public-base-url: ${{ needs.test.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Deploy to server
        id: deploy
        if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
      - name: Display server deployment status
        if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
