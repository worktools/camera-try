name: Prepare reviewed Camera source
on:
  push:
    branches: [prepare/camera-source031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve original formal graph
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Original complete gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          node --test camera.test.mjs | tee acceptance/camera-before.tap
          VITE_BASE_URL=./ yarn build
      - name: Official guarded two-site transaction
        run: node apply-reviewed.mjs
      - name: Complete original gates after edits
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          node --test camera.test.mjs | tee acceptance/camera.tap
          VITE_BASE_URL=./ yarn build
          git diff --quiet -- camera.mjs camera.test.mjs deps.cirru package.json yarn.lock .yarnrc.yml
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R js-out acceptance/js-out
          cp -R dist acceptance/dist
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: camera-source-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
